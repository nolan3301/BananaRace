    scene.add(gridHelper);

    // Factory function to build distinct 3D car models based on class
    function createCarModel(carClass) {
      const group = new THREE.Group();

      if (carClass === 'Small') {
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00e676, roughness: 0.3 });

        mainBody.position.y = 0.5;
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.6, 1.8), bodyMat);
        cabin.position.set(0, 1.0, -0.1);

        delete cars[data.playerId];

    });

    gasPedal.addEventListener('mouseup', () => { isAccelerating = false; gasPedal.classList.remove('active'); });

          playerId: myPlayerId,
          carClass: selectedClass,

          posZ: posZ,
          rotationAngle: rotationAngle,
          accelerating: isAccelerating
        });

        if (cars[myPlayerId]) {
          cars[myPlayerId].posX = posX;
          cars[myPlayerId].posZ = posZ;
          cars[myPlayerId].rotationAngle = rotationAngle;
          cars[myPlayerId].accelerating = isAccelerating;
        }
      }

      for (let id in cars) {
        let data = cars[id];
        let carGroup = data.group;

        carGroup.position.x = data.posX;
        carGroup.position.z = data.posZ;
        carGroup.rotation.y = data.rotationAngle;

        if (id === myPlayerId) {
          let camDist = 5;

          camera.position.z = carGroup.position.z - Math.cos(rotationAngle) * camDist;
          camera.position.y = carGroup.position.y + camHeight;

            carGroup.position.y,
            carGroup.position.z + Math.cos(rotationAngle) * 2
          );
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

<!DOCTYPE html>

<body>

<div id="map"></div>

<div id="start-overlay">

<!-- Cockpit script (wrapped so its variable names don't clash with game.js) -->
<script>
(function () {
  const socket = io();
  const launchBtn = document.getElementById('launch-btn');
  const overlay = document.getElementById('start-overlay');
  const gasPedal = document.getElementById('gas-pedal');
  const classButtons = document.querySelectorAll('.class-btn');

  let selectedClass = 'Small';
  let myPlayerId = null;
  let posX = 0, posZ = 0, rotationAngle = 0, isAccelerating = false;
  let steeringInput = 0;
  const cars = {};

  classButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      classButtons.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedClass = btn.getAttribute('data-class');
    });
  });

  // Three.js on top of the map (transparent background, no grid)
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 3, 5);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.domElement.id = 'game-canvas';
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(10, 20, 10);
  scene.add(dirLight);

  function createCarModel(carClass) {
    const group = new THREE.Group();
    if (carClass === 'Small') {
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00e676, roughness: 0.3 });
      const mainBody = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.5, 2.0), bodyMat);
      mainBody.position.y = 0.3;
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.4, 1.1), bodyMat);
      cabin.position.set(0, 0.7, -0.1);
      group.add(mainBody, cabin);
    } else if (carClass === 'Large') {
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2979ff, roughness: 0.4 });
      const mainBody = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.8, 2.6), bodyMat);
      mainBody.position.y = 0.5;
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.6, 1.8), bodyMat);
      cabin.position.set(0, 1.0, -0.1);
      group.add(mainBody, cabin);
    } else if (carClass === 'Bougie') {
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
      const accentMat = new THREE.MeshStandardMaterial({ color: 0xffd700 });
      const mainBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 2.8), bodyMat);
      mainBody.position.y = 0.3;
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.35, 1.4), bodyMat);
      cabin.position.set(0, 0.65, -0.2);
      const underglow = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.05, 2.85), accentMat);
      underglow.position.y = 0.1;
      group.add(mainBody, cabin, underglow);
    }
    return group;
  }

  socket.on('assigned-player', (data) => { myPlayerId = data.playerId; });

  socket.on('sync-players', (players) => {
    for (let id in players) {
      if (!cars[id]) {
        const pData = players[id];
        const carGroup = createCarModel(pData.carClass || 'Small');
        scene.add(carGroup);
        cars[id] = { group: carGroup, posX: pData.posX || 0, posZ: pData.posZ || 0, rotationAngle: pData.rotationAngle || 0, accelerating: false };
      }
    }
  });

  socket.on('update-car-state', (data) => {
    if (cars[data.playerId]) {
      cars[data.playerId].posX = data.posX;
      cars[data.playerId].posZ = data.posZ;
      cars[data.playerId].rotationAngle = data.rotationAngle;
      cars[data.playerId].accelerating = data.accelerating;
    } else {
      const carGroup = createCarModel(data.carClass || 'Small');
      scene.add(carGroup);
      cars[data.playerId] = { group: carGroup, posX: data.posX, posZ: data.posZ, rotationAngle: data.rotationAngle, accelerating: data.accelerating };
    }
  });

  socket.on('player-left', (data) => {
    if (cars[data.playerId]) {
      scene.remove(cars[data.playerId].group);
      delete cars[data.playerId];
    }
  });

  launchBtn.addEventListener('click', async () => {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const response = await DeviceOrientationEvent.requestPermission();
        if (response !== 'granted') { alert("Motion permission is required to steer!"); return; }
      } catch (e) { console.error("Permission error:", e); }
    }

    startSpawning();
    socket.emit('join-game', { carClass: selectedClass });

      steeringInput = Math.max(-1, Math.min(1, steeringVal / 25));
    }, true);
  });

  gasPedal.addEventListener('touchend', (e) => { e.preventDefault(); isAccelerating = false; gasPedal.classList.remove('active'); });
  gasPedal.addEventListener('mousedown', () => { isAccelerating = true; gasPedal.classList.add('active'); });
  gasPedal.addEventListener('mouseup', () => { isAccelerating = false; gasPedal.classList.remove('active'); });

  // ---- Banana fares ----
const fares = [];
let carrying = null;

function createBanana() {
  const g = new THREE.Group();
  const yellow = new THREE.MeshStandardMaterial({ color: 0xffe135, roughness: 0.5 });
  const brown = new THREE.MeshStandardMaterial({ color: 0x4a2f10 });
  const body = new THREE.Mesh(new THREE.TorusGeometry(0.6, 0.18, 8, 16, Math.PI * 0.9), yellow);
  body.rotation.z = Math.PI * 1.05;
  const tipL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), brown);
  const tipR = tipL.clone();
  tipL.position.set(-0.59, -0.09, 0);
  tipR.position.set(0.59, -0.09, 0);
  g.add(body, tipL, tipR);
  g.scale.set(1.5, 1.5, 1.5);
  g.position.y = 1.2;
  return g;
}

function spawnFare() {
  if (fares.length >= 3 || carrying) return;
  const count = 1 + Math.floor(Math.random() * 3);
  const angle = Math.random() * Math.PI * 2;
  const dist = 20 + Math.random() * 30;
  const x = posX + Math.sin(angle) * dist;
  const z = posZ + Math.cos(angle) * dist;
  const group = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const b = createBanana();
    b.position.x = (i - (count - 1) / 2) * 1.8;
    group.add(b);
  }
  group.position.set(x, 0, z);
  scene.add(group);
  fares.push({ group, x, z, count, expires: Date.now() + 23000 });
}

function startSpawning() { setInterval(spawnFare, 4000); }

function updateFares() {
  const now = Date.now();
  for (let i = fares.length - 1; i >= 0; i--) {
    const f = fares[i];
    f.group.rotation.y += 0.02;
    if (now > f.expires) {
      scene.remove(f.group);
      fares.splice(i, 1);
      continue;
    }
    if (!carrying && Math.hypot(posX - f.x, posZ - f.z) < 3) {
      carrying = { count: f.count };
      scene.remove(f.group);
      fares.splice(i, 1);
      document.getElementById('hud').textContent = '🍌 x' + f.count + ' on board';
    }
  }
}
// so to this is the end for banana fares


  function animate() {
    requestAnimationFrame(animate);

    let speed = 0.3, turnSpeed = 0.04;
    if (selectedClass === 'Large') { speed = 0.22; turnSpeed = 0.03; }
    if (selectedClass === 'Bougie') { speed = 0.36; turnSpeed = 0.045; }

    if (isAccelerating) {
      rotationAngle -= steeringInput * turnSpeed;
      posX += Math.sin(rotationAngle) * speed;
      posZ += Math.cos(rotationAngle) * speed;
    }

    if (myPlayerId) {
      socket.emit('steering-input', {
        playerId: myPlayerId, carClass: selectedClass,
        posX, posZ, rotationAngle, accelerating: isAccelerating
      });
      if (cars[myPlayerId]) {
        cars[myPlayerId].posX = posX;
        cars[myPlayerId].posZ = posZ;
        cars[myPlayerId].rotationAngle = rotationAngle;
        cars[myPlayerId].accelerating = isAccelerating;
      }
    }

    for (let id in cars) {
      let data = cars[id];
      let carGroup = data.group;
      carGroup.position.x = data.posX;
      carGroup.position.z = data.posZ;
      carGroup.rotation.y = data.rotationAngle;

      if (id === myPlayerId) {
        let camDist = 5, camHeight = 2.5;
        camera.position.x = carGroup.position.x - Math.sin(rotationAngle) * camDist;
        camera.position.z = carGroup.position.z - Math.cos(rotationAngle) * camDist;
        camera.position.y = carGroup.position.y + camHeight;
        camera.lookAt(
          carGroup.position.x + Math.sin(rotationAngle) * 2,
          carGroup.position.y,
          carGroup.position.z + Math.cos(rotationAngle) * 2
        );
      }
    }
    updateFares();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
})();
</script>

<script>
function initMap() {
  new google.maps.Map(document.getElementById('map'), {
    center: { lat: 40.7934, lng: -77.8600 },
    zoom: 15,
    disableDefaultUI: true,
    gestureHandling: 'none'
  });
}
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBrfWvkpla6va6HppKdsj-e6EUJ6qElIZg&libraries=geometry,places&callback=initMap"></script>
